<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f8fafc; stroke: #1f2937; stroke-width: 2; }
    .board { fill: #0f3d2e; stroke: #082419; stroke-width: 2; }
    .title { font-size: 16px; font-weight: 700; fill: #111827; }
    .sub { font-size: 12px; fill: #4b5563; }
    .pin { font-size: 13px; fill: #111827; }
    .bpin { font-size: 13px; fill: #e8f6ee; font-family: Consolas, Menlo, monospace; }
    .btitle { font-size: 18px; font-weight: 700; fill: #ffffff; }
    .bnote { font-size: 12px; fill: #b9dcc8; }
    .w { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .spi { stroke: #2563eb; } .mic { stroke: #16a34a; } .amp { stroke: #9333ea; }
    .v33 { stroke: #f97316; } .v5 { stroke: #dc2626; } .gnd { stroke: #111827; }
    .sense { stroke: #ca8a04; } .btn { stroke: #0d9488; } .spk { stroke: #6b7280; }
    .dot { fill: #111827; }
    .flag rect { stroke-width: 1.5; }
    .flag text { font-size: 12px; font-weight: 700; text-anchor: middle; }
    .small { font-size: 11px; fill: #4b5563; }
    .nc { font-size: 11px; fill: #9ca3af; font-style: italic; }
  </style>
  <rect class="bg" width="1500" height="1000"/>
  <text x="40" y="44" font-size="26" font-weight="800" fill="#111827">Tony &#8212; wiring diagram</text>
  <text x="40" y="66" class="sub">Every connection, pin to pin. Same wiring as schematic/WIRING.md and firmware/include/pins.h.</text>

  <!-- ESP32-S3 board -->
  <rect class="board" x="600" y="90" width="300" height="770" rx="14"/>
  <rect x="680" y="105" width="140" height="60" rx="6" fill="#1f2937" stroke="#94a3b8"/>
  <circle cx="750" cy="135" r="16" fill="#0b1220" stroke="#64748b" stroke-width="3"/>
  <text x="750" y="182" text-anchor="middle" class="bnote">OV3660 camera</text>
  <text x="750" y="372" text-anchor="middle" class="btitle">ESP32-S3 N16R8 CAM</text>
  <text x="750" y="391" text-anchor="middle" class="bnote">Freenove ESP32-S3-WROOM CAM layout</text>
  <text x="750" y="540" text-anchor="middle" class="bnote">Already used on the board:</text>
  <text x="750" y="558" text-anchor="middle" class="bnote">camera GPIO 4&#8211;13, 15&#8211;18</text>
  <text x="750" y="576" text-anchor="middle" class="bnote">PSRAM 35&#8211;37 &#183; USB 19, 20</text>
  <text x="750" y="594" text-anchor="middle" class="bnote">RGB LED 48 = camera-on light</text>
  <text x="750" y="728" text-anchor="middle" font-size="12" font-weight="700" fill="#fde68a">Leave the microSD slot EMPTY</text>
  <text x="750" y="746" text-anchor="middle" class="bnote">(the amp borrows GPIO 38&#8211;40)</text>

  <!-- board pins, left -->
  <g class="bpin">
    <text x="612" y="214">GPIO21</text><text x="612" y="244">GPIO47</text>
    <text x="612" y="304">GPIO2</text><text x="612" y="334">GPIO14</text>
    <text x="612" y="634">GPIO42</text><text x="612" y="664">GPIO41</text><text x="612" y="694">GPIO3</text>
    <text x="612" y="784">3V3</text><text x="612" y="824">GND</text>
  </g>
  <!-- board pins, right -->
  <g class="bpin" text-anchor="end">
    <text x="888" y="154">GPIO39</text><text x="888" y="184">GPIO38</text><text x="888" y="214">GPIO40</text>
    <text x="888" y="434">GPIO0 (BOOT)</text><text x="888" y="504">GPIO1</text>
    <text x="888" y="784">5V</text><text x="888" y="824">GND</text>
  </g>

  <!-- TFT -->
  <rect class="box" x="120" y="110" width="210" height="290" rx="10"/>
  <text x="140" y="136" class="title">2.0" TFT &#183; ST7789</text>
  <text x="140" y="152" class="sub">240&#215;320, SPI</text>
  <g class="pin" text-anchor="end">
    <text x="320" y="184">VCC</text><text x="320" y="214">SCL</text><text x="320" y="244">SDA</text>
    <text x="320" y="274">RES</text><text x="320" y="304">DC</text><text x="320" y="334">CS</text>
    <text x="320" y="364">BLK</text><text x="320" y="390">GND</text>
  </g>
  <path class="w spi" d="M330 210 H600"/><path class="w spi" d="M330 240 H600"/>
  <path class="w spi" d="M330 300 H600"/><path class="w spi" d="M330 330 H600"/>
  <path class="w v33" d="M330 180 H372"/><path class="w v33" d="M330 270 H372"/><path class="w v33" d="M330 360 H372"/>
  <path class="w gnd" d="M330 386 H372"/>
  <g class="flag"><rect x="372" y="169" width="46" height="22" rx="5" fill="#fff7ed" stroke="#f97316"/><text x="395" y="185" fill="#c2410c">3V3</text></g>
  <g class="flag"><rect x="372" y="259" width="46" height="22" rx="5" fill="#fff7ed" stroke="#f97316"/><text x="395" y="275" fill="#c2410c">3V3</text></g>
  <g class="flag"><rect x="372" y="349" width="46" height="22" rx="5" fill="#fff7ed" stroke="#f97316"/><text x="395" y="365" fill="#c2410c">3V3</text></g>
  <g class="flag"><rect x="372" y="375" width="46" height="22" rx="5" fill="#f3f4f6" stroke="#111827"/><text x="395" y="391" fill="#111827">GND</text></g>
  <text x="465" y="204" class="small" text-anchor="middle">SCK</text>
  <text x="465" y="234" class="small" text-anchor="middle">MOSI</text>

  <!-- INMP441 -->
  <rect class="box" x="120" y="500" width="210" height="220" rx="10"/>
  <text x="140" y="526" class="title">INMP441 mic</text>
  <text x="140" y="542" class="sub">I2S MEMS microphone</text>
  <g class="pin" text-anchor="end">
    <text x="320" y="574">VDD</text><text x="320" y="604">GND</text><text x="320" y="634">WS</text>
    <text x="320" y="664">SCK</text><text x="320" y="694">SD</text><text x="320" y="712">L/R</text>
  </g>
  <path class="w mic" d="M330 630 H600"/><path class="w mic" d="M330 660 H600"/><path class="w mic" d="M330 690 H600"/>
  <path class="w v33" d="M330 570 H372"/><path class="w gnd" d="M330 600 H372"/><path class="w gnd" d="M330 708 H372"/>
  <g class="flag"><rect x="372" y="559" width="46" height="22" rx="5" fill="#fff7ed" stroke="#f97316"/><text x="395" y="575" fill="#c2410c">3V3</text></g>
  <g class="flag"><rect x="372" y="589" width="46" height="22" rx="5" fill="#f3f4f6" stroke="#111827"/><text x="395" y="605" fill="#111827">GND</text></g>
  <g class="flag"><rect x="372" y="697" width="46" height="22" rx="5" fill="#f3f4f6" stroke="#111827"/><text x="395" y="713" fill="#111827">GND</text></g>
  <text x="440" y="740" class="small">L/R to GND = left channel</text>

  <!-- board power out, left -->
  <path class="w v33" d="M600 780 H560"/><path class="w gnd" d="M600 820 H560"/>
  <g class="flag"><rect x="514" y="769" width="46" height="22" rx="5" fill="#fff7ed" stroke="#f97316"/><text x="537" y="785" fill="#c2410c">3V3</text></g>
  <g class="flag"><rect x="514" y="809" width="46" height="22" rx="5" fill="#f3f4f6" stroke="#111827"/><text x="537" y="825" fill="#111827">GND</text></g>
  <text x="440" y="800" class="small" text-anchor="middle">all 3V3 / GND flags</text>
  <text x="440" y="814" class="small" text-anchor="middle">join here</text>

  <!-- MAX98357A -->
  <rect class="box" x="1170" y="110" width="210" height="250" rx="10"/>
  <text x="1275" y="136" class="title" text-anchor="middle">MAX98357A</text>
  <text x="1275" y="152" class="sub" text-anchor="middle">I2S amplifier</text>
  <g class="pin">
    <text x="1180" y="154">LRC</text><text x="1180" y="184">BCLK</text><text x="1180" y="214">DIN</text><text x="1180" y="244">GAIN</text>
    <text x="1180" y="274">SD</text><text x="1180" y="304">GND</text><text x="1180" y="334">VIN</text>
  </g>
  <g class="pin" text-anchor="end"><text x="1370" y="204">OUT+</text><text x="1370" y="264">OUT&#8722;</text></g>
  <path class="w amp" d="M900 150 H1170"/><path class="w amp" d="M900 180 H1170"/><path class="w amp" d="M900 210 H1170"/>
  <path class="w spk" d="M1155 240 H1170"/><path class="w spk" d="M1155 270 H1170"/>
  <text x="1150" y="244" class="nc" text-anchor="end">not connected</text>
  <text x="1150" y="274" class="nc" text-anchor="end">not connected</text>
  <path class="w gnd" d="M1170 300 H1100"/><path class="w v5" d="M1170 330 H1100"/>
  <g class="flag"><rect x="1054" y="289" width="46" height="22" rx="5" fill="#f3f4f6" stroke="#111827"/><text x="1077" y="305" fill="#111827">GND</text></g>
  <g class="flag"><rect x="1054" y="319" width="46" height="22" rx="5" fill="#fef2f2" stroke="#dc2626"/><text x="1077" y="335" fill="#b91c1c">5V</text></g>
  <!-- 470 uF across VIN / GND -->
  <path class="w gnd" d="M1135 300 V309"/><path class="w v5" d="M1135 321 V330"/>
  <path d="M1122 309 H1148" stroke="#111827" stroke-width="3"/><path d="M1122 321 H1148" stroke="#111827" stroke-width="3"/>
  <text x="1152" y="331" font-size="12" fill="#b91c1c">+</text>
  <text x="1135" y="352" class="small" text-anchor="middle">470 &#181;F</text>
  <text x="1035" y="140" class="small" text-anchor="middle">LRC</text>
  <text x="1035" y="170" class="small" text-anchor="middle">BCLK</text>
  <text x="1035" y="200" class="small" text-anchor="middle">DIN</text>

  <!-- speaker -->
  <path class="w spk" d="M1380 200 H1420"/><path class="w spk" d="M1380 260 H1420"/>
  <rect x="1420" y="195" width="20" height="70" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/>
  <path d="M1440 195 L1475 170 L1475 290 L1440 265 Z" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/>
  <text x="1448" y="312" class="pin" text-anchor="middle">Speaker</text>
  <text x="1448" y="328" class="small" text-anchor="middle">8 &#937; &#183; 1 W</text>

  <!-- button on GPIO0 -->
  <path class="w btn" d="M900 430 H962"/><path class="w btn" d="M1008 430 H1040"/>
  <circle cx="966" cy="430" r="4" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
  <circle cx="1004" cy="430" r="4" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
  <path d="M958 416 H1012 M985 416 V404" stroke="#0d9488" stroke-width="3" stroke-linecap="round"/>
  <g class="flag"><rect x="1040" y="419" width="46" height="22" rx="5" fill="#f3f4f6" stroke="#111827"/><text x="1063" y="435" fill="#111827">GND</text></g>
  <text x="985" y="458" class="small" text-anchor="middle">optional stand button</text>
  <text x="985" y="472" class="small" text-anchor="middle">(BOOT already does this)</text>

  <!-- battery sense divider -->
  <path class="w sense" d="M900 500 H1185"/>
  <path class="w sense" d="M1185 500 V470"/><rect x="1176" y="410" width="18" height="60" rx="3" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <path class="w gnd" d="M1185 410 V396"/>
  <g class="flag"><rect x="1162" y="374" width="46" height="22" rx="5" fill="#f3f4f6" stroke="#111827"/><text x="1185" y="390" fill="#111827">GND</text></g>
  <text x="1202" y="445" class="small">100 k&#937;</text>
  <path class="w sense" d="M1185 500 V560"/><rect x="1176" y="560" width="18" height="60" rx="3" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <path class="w sense" d="M1185 620 V650"/>
  <text x="1202" y="595" class="small">100 k&#937;</text>
  <circle class="dot" cx="1185" cy="500" r="5"/>
  <circle class="dot" cx="1185" cy="650" r="5"/>
  <text x="1040" y="492" class="small" text-anchor="middle">battery voltage &#247; 2</text>

  <!-- charger / boost -->
  <rect class="box" x="1000" y="570" width="140" height="210" rx="10"/>
  <text x="1070" y="594" class="title" text-anchor="middle" style="font-size:14px">Charger + 5V boost</text>
  <text x="1070" y="610" class="sub" text-anchor="middle">IP5306 module</text>
  <g class="pin"><text x="1008" y="644">5V OUT</text><text x="1008" y="724">GND</text></g>
  <g class="pin" text-anchor="end"><text x="1132" y="654">B+</text><text x="1132" y="704">B&#8722;</text></g>
  <rect x="1040" y="748" width="60" height="16" rx="8" fill="#e5e7eb" stroke="#1f2937"/>
  <text x="1070" y="798" class="small" text-anchor="middle">USB-C: charge here</text>

  <!-- batteries -->
  <rect class="box" x="1230" y="610" width="210" height="130" rx="10"/>
  <text x="1345" y="634" class="title" text-anchor="middle" font-size="14">2&#215; 18650 Li-ion</text>
  <text x="1345" y="650" class="sub" text-anchor="middle">in PARALLEL (1S2P)</text>
  <g class="pin"><text x="1240" y="654">B+</text><text x="1240" y="704">B&#8722;</text></g>
  <rect x="1285" y="668" width="62" height="24" rx="5" fill="#bfdbfe" stroke="#1f2937"/><rect x="1347" y="674" width="5" height="12" fill="#1f2937"/>
  <rect x="1365" y="668" width="62" height="24" rx="5" fill="#bfdbfe" stroke="#1f2937"/><rect x="1427" y="674" width="5" height="12" fill="#1f2937"/>
  <text x="1316" y="685" class="small" text-anchor="middle">+  3.7 V</text>
  <text x="1396" y="685" class="small" text-anchor="middle">+  3.7 V</text>
  <text x="1345" y="722" class="small" text-anchor="middle">+ to +, &#8722; to &#8722;</text>
  <path class="w v5" d="M1140 650 H1230"/><path class="w gnd" d="M1140 700 H1230"/>

  <!-- 5V rail with switch -->
  <path class="w v5" d="M1000 640 H986"/>
  <circle cx="982" cy="640" r="4" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <circle cx="952" cy="640" r="4" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <path d="M952 640 L980 624" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
  <text x="967" y="614" class="small" text-anchor="middle">power switch</text>
  <path class="w v5" d="M948 640 H915 V780 H900"/>
  <text x="922" y="712" font-size="12" font-weight="700" fill="#b91c1c">5V</text>
  <path class="w gnd" d="M1000 720 H945 V820 H900"/>

  <!-- legend -->
  <g transform="translate(40 900)">
    <text x="0" y="0" font-size="14" font-weight="700" fill="#111827">Wire colors</text>
    <path class="w spi" d="M0 22 H40"/><text x="48" y="26" class="pin">Display SPI</text>
    <path class="w mic" d="M160 22 H200"/><text x="208" y="26" class="pin">Mic I2S</text>
    <path class="w amp" d="M300 22 H340"/><text x="348" y="26" class="pin">Amp I2S</text>
    <path class="w v5" d="M440 22 H480"/><text x="488" y="26" class="pin">5V / battery +</text>
    <path class="w v33" d="M610 22 H650"/><text x="658" y="26" class="pin">3V3</text>
    <path class="w gnd" d="M720 22 H760"/><text x="768" y="26" class="pin">GND</text>
    <path class="w sense" d="M830 22 H870"/><text x="878" y="26" class="pin">Battery sense</text>
    <path class="w btn" d="M1000 22 H1040"/><text x="1048" y="26" class="pin">Button</text>
    <text x="0" y="58" class="sub">Flags with the same name are the same wire. Switch the power OFF whenever the board is plugged into USB, so the</text>
    <text x="0" y="74" class="sub">boost converter and the computer never both drive 5V. Keep the I2S wires short (under ~15 cm) and the mic away from the speaker.</text>
  </g>
</svg>
